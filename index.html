<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
		<meta name="theme-color" content="%APP_THEME_COLOR%" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>%APP_TITLE%</title>

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400..700&family=Chewy&family=Pacifico&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400..700&family=Chewy&family=Pacifico&display=swap"
				rel="stylesheet"
			/>
		</noscript>

		<!-- SEO Meta Tags -->
		<meta name="author" content="%APP_AUTHOR%" />
		<meta name="keywords" content="%APP_KEYWORDS%" />
		<meta name="description" content="%APP_DESCRIPTION%" />

		<!-- Open Graph / Social (Static Bootstrap Metadata) -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="%APP_TITLE%" />
		<meta property="og:description" content="%APP_DESCRIPTION%" />
		<meta property="og:image" content="/og-image.png" />

		<!-- Twitter (Static Bootstrap Metadata) -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="%APP_TITLE%" />
		<meta name="twitter:description" content="%APP_DESCRIPTION%" />
		<meta name="twitter:image" content="/og-image.png" />

		<!-- Catch install prompt early before React loads -->
		<script>
			window.__hasInstallListener = true;
			window.addEventListener("beforeinstallprompt", (e) => {
				e.preventDefault();
				window.__deferredPrompt = e;
				window.__isInstallable = true;
				window.dispatchEvent(new Event("app-installable"));
			});
		</script>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
